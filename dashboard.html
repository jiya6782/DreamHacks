<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Island Resource Station</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- Tailwind (Play CDN — JIT, no build step, arbitrary values work out of the box) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Base tokens / focus states not covered by utility classes -->
<link rel="stylesheet" href="./styles.css" />

<!-- React + ReactDOM + Babel, all from CDN -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- App.jsx is transpiled in-browser by Babel and loaded as an ES module here,
     so its `import React from "react"` line resolves via the import map above. -->
<script type="text/babel" data-type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import App from "./App.jsx";

  createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
